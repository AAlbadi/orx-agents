services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - voice-network

  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aria-voice-agent
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      # Mount application code for live updates
      - ./app:/app/app
      # Persist client databases, recordings, and configurations
      - ./data:/app/data
      # Persist downloaded models and local caches outside the container
      - kokoro-cache:/root/.cache/pipecat/kokoro-onnx
      - whisper-cache:/root/.cache/whisper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - voice-network

  # Cloudflare Tunnel service: securely exposes your local voice agent to the internet
  # without opening inbound firewall ports on Oracle Cloud or home routers.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aria-cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - voice-agent
    networks:
      - voice-network
    # Only starts if CLOUDFLARE_TUNNEL_TOKEN is set or when explicitly requested
    profiles:
      - with-tunnel

volumes:
  kokoro-cache:
  whisper-cache:

networks:
  voice-network:
    driver: bridge
